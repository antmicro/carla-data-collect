sensors:
  - type: IMUSensor
    name: "imu_1"
    transform:
      translate: 
        x: 0
        y: 0
        z: 0
      rotation:
        pitch: 0
        yaw: 0
        roll: 0
    attributes:
      accelerometer_limits: 199.9
      gyroscope_limits: 99.9
  - type: IMUSensor
    name: "imu_2"
    transform:
      translate: 
        x: 0
        y: 0
        z: 0.5
      rotation:
        pitch: 90
        yaw: 0
        roll: 0
    attributes:
      accelerometer_limits: 99.9
      gyroscope_limits: 99.9
  - type: CollisionSensor
    name: "col_1"
dataset:
  type: IMUAnomalyDataset
  attributes:
    output_path: imu_anomaly.csv 
    sep: ','
    sensor_imu_name: "imu_1"
    accel_threshold: 0
    sensor_collision_name: "col_1"
    collision_intensity_threshold: 1000.0