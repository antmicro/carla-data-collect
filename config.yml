sensors:
  - type: IMUSensor
    name: "imu_1"
    transform:
      translate: 
        x: 0
        y: 0
        z: 0
      rotation:
        pitch: 0
        yaw: 0
        roll: 0
    attributes:
      accelerometer_limits: 199.9
      gyroscope_limits: 99.9
  - type: CollisionSensor
    name: "col_1"
  - type: SpeedSensor
    name: "speed"
  - type: GnssSensor
    name: "gnss"
  - type: KeyStrokeSensor
    name: "keys"
  - type: LaneInvasionSensor
    name: "lane"
  - type: VehicleStateSensor
    name: "vehicle"
dataset:
  type: IMUAnomalyDataset
  attributes:
    output_path: imu_anomaly.csv 
    sep: ','
    sensor_imu_name: "imu_1"
    accel_threshold: 0
    sensor_collision_name: "col_1"
    collision_intensity_threshold: 1000.0
    detect_sudden_speeding: true
    detect_sudden_braking: true
    detect_sudden_steering: true