[project]
name = "carla-data-collect"
version = "0.1.0"
description = "A package used for collecting and formatting sensory data from Carla simulator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "carla>=0.9.16",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pygame>=2.6.1",
    "pyyaml>=6.0.3",
]

[tool.ruff]
preview = true
line-length = 79
select = [
    "I",      # enable isort
    "D",      # docstring errors
    "E",      # PEP8 errors
    "E261",   # At least two spaces before inline comment
    "E225",   # Missing whitespace around operator
    "F",      # PEP8 warnings
    "RUF100", # disallowed unnecessary noqa
]

ignore = [
    "E203",  # Whitespace before ':'
    "D105",  # Missing docstring in magic method
    "D204",  # 1 blank line required after class docstring
    "D205",  # 1 blank line required between summary line and description
    "D200",  # One-line docstring should fit on one line
    "D102",  # Missing docstring in public method
    "D401",  # First line of docstring should be in imperative mood
    "D407",  # Missing argument description in the docstring (handled by pydoclint)
    "D212",  # Multi-line docstring summary should start at the first line
]